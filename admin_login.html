
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E6E0F8">

    <title>Admin Login | Project Lavender</title>

    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <div class="login-logo">🪻</div>

            <h1>Project Lavender</h1>
            <p class="login-subtitle">Admin Portal</p>

            <h2>Welcome Back!</h2>
            <p class="login-description">Sign in to manage student orders.</p>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <input
                        type="text"
                        id="adminUsername"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button type="button" id="togglePassword">Show</button>
                    </div>
                </div>

                <p id="loginMessage" class="form-message" aria-live="polite"></p>

                <button type="submit" class="login-btn">Login</button>

            </form>

            <p class="create_admin">
                <a href="admin_register.html">Create an admin account</a>
            </p>

            <a href="../student/index.html" class="back-link">← Back to Student Portal</a>

        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
